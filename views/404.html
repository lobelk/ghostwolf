<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página não encontrada - GhostWolf">
  <title>404 - Página não encontrada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 180, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.06) 0%, transparent 40%);
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .code {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #0090e0, #00b4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      color: #8ba3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #0090e0, #00b4ff);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #00b4ff, #00d0ff);
      box-shadow: 0 0 20px rgba(0, 180, 255, 0.4);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(224, 240, 255, 0.1);
      font-size: 12px;
      color: #4a5a6a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>Desculpe, a página que você está procurando não existe ou foi removida.</p>
    <a href="/" class="btn">Voltar ao Início</a>
    <div class="footer">
      GhostWolf System • Acesso Seguro
    </div>
  </div>

  <script>
    // Redirecionamento após 5 segundos (opcional)
    setTimeout(() => {
      // Apenas redireciona se o usuário não clicar no botão
      // window.location.href = '/';
    }, 5000);
  </script>
</body>
</html>
