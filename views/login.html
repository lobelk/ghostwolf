<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GhostWolf - Sistema de acesso seguro">
  <meta name="theme-color" content="#00b4ff">
  <title>GhostWolf - Login</title>
  <link rel="stylesheet" href="public/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <div class="logo-icon">
          <img src="img/logo.png" alt="GhostWolf logo" title="GhostWolf">
        </div>
        <h1>Ghost<span>Wolf</span></h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input 
            type="text" 
            id="matricula" 
            name="matricula" 
            placeholder="Ex: arthur.lopes ou adm" 
            autocomplete="username"
            required
            aria-label="Matrícula">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            autocomplete="current-password"
            required
            aria-label="Senha">
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <div class="footer">
        GhostWolf System • Secure Access
      </div>
    </div>
  </div>

  <script src="public/js/utils.js"></script>
  <script src="public/js/login.js"></script>
</body>
</html>
